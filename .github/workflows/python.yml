name: Python checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python-linux
            os: ubuntu-24.04
            python: '3.13'
          - name: python-macos
            os: macos-15
            python: '3.13'
          - name: python-windows
            os: windows-2025
            python: '3.13'
          - name: python-minimum
            os: ubuntu-22.04
            python: '3.9'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Report interpreter
        run: python -VV
      - name: Compile and test
        run: python tests/run_checks.py
