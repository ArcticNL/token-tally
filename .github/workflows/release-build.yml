name: Build one release platform
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      image:
        required: true
        type: string
      arch:
        required: true
        type: string
    outputs:
      artifact_id:
        description: Exact digest artifact produced by this build
        value: ${{ jobs.build.outputs.artifact_id }}
permissions: {}
jobs:
  build:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      artifact_id: ${{ steps.digest.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          platforms: linux/${{ inputs.arch }}
          tags: ${{ inputs.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.arch }}
          build-args: |
            TOKEN_TALLY_VERSION=${{ inputs.version }}
            TOKEN_TALLY_REVISION=${{ inputs.source_sha }}
      - name: Save only this platform's registry digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ inputs.arch }}
        run: printf '%s' "$DIGEST" > "$ARCH.digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: digest
        with:
          name: build-digest-${{ inputs.arch }}-${{ github.run_attempt }}
          path: ${{ inputs.arch }}.digest
          if-no-files-found: error
          retention-days: 7
