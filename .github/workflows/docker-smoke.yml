name: Docker smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    name: docker-smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the native image once
        env:
          PLATFORM: linux/${{ matrix.arch }}
        run: docker build --platform "$PLATFORM" --tag token-tally:smoke .
      - name: Exercise production Compose configuration
        env:
          PLATFORM: linux/${{ matrix.arch }}
        run: python3 -B tests/test_docker_smoke.py --image token-tally:smoke --platform "$PLATFORM"
      - name: Exercise legacy deployment failure in temporary repositories
        run: python3 -B tests/test_deploy_docker.py --image token-tally:smoke
      - name: Verify release rollback preserves identity and data
        run: python3 -B tests/test_release_update_docker.py --image token-tally:smoke
