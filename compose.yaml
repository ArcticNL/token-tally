# Run the office with:   docker compose up -d
# Settings go in .env next to this file (copy .env.example). See docs/docker.md.
services:
  office:
    build: .
    image: token-tally-office:latest
    container_name: token-tally
    restart: unless-stopped
    init: true
    ports:
      - "8377:8377"
    environment:
      OFFICE_ALLOW_HOSTS: ${OFFICE_ALLOW_HOSTS:-}
      OFFICE_EXTRA_URLS: ${OFFICE_EXTRA_URLS:-}
    # The container's user. With a data folder (OFFICE_DATA below), set this to the folder's
    # owner in .env, so the office can read and write it.
    user: "${OFFICE_UID:-10001}:${OFFICE_GID:-10001}"
    volumes:
      # The key and names: a Docker volume by default, or a folder such as ./data (set in .env).
      - ${OFFICE_DATA:-office-data}:/data
      # For a separate names file, use the private compose.override.yaml described
      # in docs/docker.md. With a data folder, just put names.txt in it.
    # Locked down: nothing but /data is writable, no extra privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  office-data:
